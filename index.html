<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>مهند عبدالرحمن محمدعلى | الموقع الشخصي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-dark: #07050d;
            --bg-card: rgba(20, 14, 34, 0.84);
            --bg-soft: rgba(157, 78, 221, 0.08);
            --bg-input: rgba(11, 8, 20, 0.92);
            --purple-main: #9d4edd;
            --purple-bright: #c77dff;
            --purple-neon: #e0aaff;
            --purple-deep: #5a189a;
            --purple-glow: rgba(157, 78, 221, 0.36);
            --text-main: #ffffff;
            --text-muted: #c4b5fd;
            --border-soft: rgba(199, 125, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.65;
        }

        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.52;
            animation: driftOrb 12s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #9d4edd, transparent 72%);
            top: -90px;
            right: -70px;
        }

        .orb-2 {
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, #6930c3, transparent 72%);
            bottom: -120px;
            left: -90px;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #c77dff, transparent 72%);
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.22;
            animation-duration: 9s;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(199, 125, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(199, 125, 255, 0.045) 1px, transparent 1px);
            background-size: 38px 38px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
        }

        @keyframes driftOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(26px, -22px) scale(1.08); }
            100% { transform: translate(-20px, 20px) scale(0.96); }
        }

        body.vibe-boost .orb {
            opacity: 0.85;
            filter: blur(58px) saturate(1.45);
        }

        .page-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 18px 60px;
            position: relative;
            z-index: 1;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            padding: 14px 20px;
            margin-bottom: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--purple-bright), var(--purple-deep));
            color: #fff;
            font-weight: 900;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--purple-glow);
        }

        .brand-name {
            font-size: 1.12rem;
            font-weight: 900;
            color: #fff;
        }

        .brand-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
